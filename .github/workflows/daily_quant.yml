name: Daily Quant Scan

on:
  schedule:
    # Runs at 22:00 UTC (roughly 5:00 PM EST/EDT) Monday through Friday
    - cron: '0 22 * * 1-5'
  
  # This allows you to click a button in GitHub to run it manually
  workflow_dispatch: 

jobs:
  run-quant-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Matches most Streamlit environments

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto Logger Script
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: python auto_logger.py
